<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#0b1524"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="48" font-size="28" fill="#d9e4f0" font-weight="bold">WHY THE HOTSPOTS WERE PLAUSIBLE</text><text x="36" y="81" font-size="18" fill="#d9e4f0" font-weight="normal">A decoder learns to interpret feature numbers. Moving those numbers to different texels breaks that interpretation.</text><text x="36" y="136" font-size="21" fill="#d9e4f0" font-weight="bold">OLD TRAINING</text><rect x="36" y="160" width="77" height="100" rx="12" fill="#e2a24c"/><rect x="119" y="160" width="77" height="100" rx="12" fill="#e2a24c"/><rect x="202" y="160" width="77" height="100" rx="12" fill="#355874"/><rect x="285" y="160" width="77" height="100" rx="12" fill="#355874"/><text x="36" y="296" font-size="18" fill="#d9e4f0" font-weight="normal">Subset 0 incorrectly owns C/D</text><text x="426" y="136" font-size="21" fill="#d9e4f0" font-weight="bold">EXPORTED / GPU</text><rect x="426" y="160" width="77" height="100" rx="12" fill="#355874"/><rect x="509" y="160" width="77" height="100" rx="12" fill="#355874"/><rect x="592" y="160" width="77" height="100" rx="12" fill="#e2a24c"/><rect x="675" y="160" width="77" height="100" rx="12" fill="#e2a24c"/><text x="426" y="296" font-size="18" fill="#d9e4f0" font-weight="normal">Subset 0 owns A/B</text><text x="816" y="136" font-size="21" fill="#d9e4f0" font-weight="bold">FIXED TRAINING</text><rect x="816" y="160" width="77" height="100" rx="12" fill="#355874"/><rect x="899" y="160" width="77" height="100" rx="12" fill="#355874"/><rect x="982" y="160" width="77" height="100" rx="12" fill="#e2a24c"/><rect x="1065" y="160" width="77" height="100" rx="12" fill="#e2a24c"/><text x="816" y="296" font-size="18" fill="#d9e4f0" font-weight="normal">Subset 0 owns A/B</text><rect x="36" y="335" width="1130" height="119" rx="12" fill="#16283d"/><text x="56" y="372" font-size="24" fill="#ffcb70" font-weight="bold">Old final tuning still used the wrong decoder.</text><text x="56" y="410" font-size="19" fill="#d9e4f0" font-weight="normal">More updates could fit the wrong representation better; export still rearranged the feature values.</text><text x="36" y="498" font-size="19" fill="#d9e4f0" font-weight="normal">Other corrections: exact quantization • FP16 weight loading • clamp borders • one LOD conversion</text><text x="36" y="535" font-size="18" fill="#d9e4f0" font-weight="normal">Original lost weights cannot be tested. This is a proven code defect and a reproduced failure mechanism,</text><text x="36" y="566" font-size="18" fill="#d9e4f0" font-weight="normal">not a claim that every hotspot in the historical screenshot has one cause.</text></g></svg>