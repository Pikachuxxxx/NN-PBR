<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="598" viewBox="0 0 1200 598"><rect width="1200" height="598" fill="#0b1524"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="48" font-size="28" fill="#d9e4f0" font-weight="bold">CLEANER OWNERSHIP: ONE JOB PER MODULE</text><rect x="36" y="88" width="1130" height="60" rx="12" fill="#16283d"/><text x="55" y="125" font-size="21" fill="#70dec2" font-weight="bold">sampling.py</text><text x="480" y="125" font-size="18" fill="#d9e4f0" font-weight="normal">UVs, LODs, mip filtering, reference checks</text><rect x="36" y="160" width="1130" height="60" rx="12" fill="#16283d"/><text x="55" y="197" font-size="21" fill="#70dec2" font-weight="bold">model.py + bc_math.py</text><text x="480" y="197" font-size="18" fill="#d9e4f0" font-weight="normal">Continuous training and exact frozen feature math</text><rect x="36" y="232" width="1130" height="60" rx="12" fill="#16283d"/><text x="55" y="269" font-size="21" fill="#70dec2" font-weight="bold">training.py</text><text x="480" y="269" font-size="18" fill="#d9e4f0" font-weight="normal">Three stages, effective batches, checkpoints/resume</text><rect x="36" y="304" width="1130" height="60" rx="12" fill="#16283d"/><text x="55" y="341" font-size="21" fill="#70dec2" font-weight="bold">codec.py</text><text x="480" y="341" font-size="18" fill="#d9e4f0" font-weight="normal">Strict Mode 10 bits and DDS I/O</text><rect x="36" y="376" width="1130" height="60" rx="12" fill="#16283d"/><text x="55" y="413" font-size="21" fill="#70dec2" font-weight="bold">artifacts.py + evaluation.py</text><text x="480" y="413" font-size="18" fill="#d9e4f0" font-weight="normal">FP16/DDS loading and exported-output measurements</text><rect x="36" y="448" width="1130" height="60" rx="12" fill="#16283d"/><text x="55" y="485" font-size="21" fill="#70dec2" font-weight="bold">material_decoder.glsl</text><text x="480" y="485" font-size="18" fill="#d9e4f0" font-weight="normal">One shared Vulkan decoder for both preview modes</text><text x="36" y="566" font-size="18" fill="#d9e4f0" font-weight="normal">Old entry-point names remain small compatibility wrappers. Legacy fake BC6 packing was removed.</text></g></svg>