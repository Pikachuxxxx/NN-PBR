<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="596" viewBox="0 0 1200 596"><rect width="1200" height="596" fill="#0b1524"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="48" font-size="29" fill="#d9e4f0" font-weight="bold">WHEN DOES THE LAST 1K HAPPEN?</text><text x="36" y="81" font-size="19" fill="#d9e4f0" font-weight="normal">These are optimizer updates, not epochs. Each phase starts after the previous one finishes.</text><rect x="36" y="118" width="350" height="240" rx="12" fill="#16283d"/><text x="54" y="155" font-size="20" fill="#68b8ff" font-weight="bold">1  WARMUP</text><text x="54" y="192" font-size="25" fill="#68b8ff" font-weight="normal">5,000 updates</text><text x="54" y="235" font-size="16" fill="#d9e4f0" font-weight="normal">Free feature texels + decoder learn.</text><text x="54" y="267" font-size="16" fill="#d9e4f0" font-weight="normal">Flexible starting point for good partitions.</text><text x="54" y="299" font-size="16" fill="#d9e4f0" font-weight="normal">No BC6 constraints yet.</text><rect x="426" y="118" width="350" height="240" rx="12" fill="#16283d"/><text x="444" y="155" font-size="20" fill="#ffcb70" font-weight="bold">2  BC6 CONSTRAINED</text><text x="444" y="192" font-size="25" fill="#ffcb70" font-weight="normal">200,000 more updates</text><text x="444" y="235" font-size="16" fill="#d9e4f0" font-weight="normal">Freeze the chosen partition per block.</text><text x="444" y="267" font-size="16" fill="#d9e4f0" font-weight="normal">Train continuous endpoints + indices</text><text x="444" y="299" font-size="16" fill="#d9e4f0" font-weight="normal">together with the decoder.</text><rect x="816" y="118" width="350" height="240" rx="12" fill="#16283d"/><text x="834" y="155" font-size="20" fill="#70dec2" font-weight="bold">3  EXACT FINAL TUNING</text><text x="834" y="192" font-size="25" fill="#70dec2" font-weight="normal">1,000 more updates</text><text x="834" y="235" font-size="16" fill="#d9e4f0" font-weight="normal">Round endpoints to 6 bits, indices to 3.</text><text x="834" y="267" font-size="16" fill="#d9e4f0" font-weight="normal">Decode exactly; freeze all feature data.</text><text x="834" y="299" font-size="16" fill="#d9e4f0" font-weight="normal">Only decoder weights keep learning.</text><text x="36" y="408" font-size="26" fill="#ffffff" font-weight="bold">Update counter: 0 → 5,000 → 205,000 → 206,000</text><rect x="36" y="442" width="1130" height="122" rx="12" fill="#16283d"/><text x="56" y="478" font-size="22" fill="#70dec2" font-weight="bold">Why the final 1k matters</text><text x="56" y="512" font-size="19" fill="#d9e4f0" font-weight="normal">Rounding changes the inputs. The decoder must adapt to the exact numbers the GPU will read.</text><text x="56" y="544" font-size="17" fill="#d9e4f0" font-weight="normal">Fixed here: final tuning sees exact BC6 values AND FP16-stored weights. Export no longer changes the answer.</text></g></svg>