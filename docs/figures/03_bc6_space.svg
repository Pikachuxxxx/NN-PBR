<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#0b1524"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="46" font-size="27" fill="#d9e4f0" font-weight="bold">BC6 SPACE: LEARN WHAT A BLOCK CAN ACTUALLY STORE</text><text x="36" y="84" font-size="18" fill="#d9e4f0" font-weight="normal">Each 4×4 RGB block occupies exactly 128 bits (16 bytes): 8 bits per texel, shared across RGB.</text><rect x="40" y="122" width="50" height="50" rx="5" fill="#285980"/><text x="58" y="155" font-size="23" fill="#d9e4f0" font-weight="normal">0</text><rect x="95" y="122" width="50" height="50" rx="5" fill="#285980"/><text x="113" y="155" font-size="23" fill="#d9e4f0" font-weight="normal">0</text><rect x="150" y="122" width="50" height="50" rx="5" fill="#236957"/><text x="168" y="155" font-size="23" fill="#d9e4f0" font-weight="normal">1</text><rect x="205" y="122" width="50" height="50" rx="5" fill="#236957"/><text x="223" y="155" font-size="23" fill="#d9e4f0" font-weight="normal">1</text><rect x="40" y="177" width="50" height="50" rx="5" fill="#285980"/><text x="58" y="210" font-size="23" fill="#d9e4f0" font-weight="normal">0</text><rect x="95" y="177" width="50" height="50" rx="5" fill="#285980"/><text x="113" y="210" font-size="23" fill="#d9e4f0" font-weight="normal">0</text><rect x="150" y="177" width="50" height="50" rx="5" fill="#236957"/><text x="168" y="210" font-size="23" fill="#d9e4f0" font-weight="normal">1</text><rect x="205" y="177" width="50" height="50" rx="5" fill="#236957"/><text x="223" y="210" font-size="23" fill="#d9e4f0" font-weight="normal">1</text><rect x="40" y="232" width="50" height="50" rx="5" fill="#285980"/><text x="58" y="265" font-size="23" fill="#d9e4f0" font-weight="normal">0</text><rect x="95" y="232" width="50" height="50" rx="5" fill="#285980"/><text x="113" y="265" font-size="23" fill="#d9e4f0" font-weight="normal">0</text><rect x="150" y="232" width="50" height="50" rx="5" fill="#236957"/><text x="168" y="265" font-size="23" fill="#d9e4f0" font-weight="normal">1</text><rect x="205" y="232" width="50" height="50" rx="5" fill="#236957"/><text x="223" y="265" font-size="23" fill="#d9e4f0" font-weight="normal">1</text><rect x="40" y="287" width="50" height="50" rx="5" fill="#285980"/><text x="58" y="320" font-size="23" fill="#d9e4f0" font-weight="normal">0</text><rect x="95" y="287" width="50" height="50" rx="5" fill="#285980"/><text x="113" y="320" font-size="23" fill="#d9e4f0" font-weight="normal">0</text><rect x="150" y="287" width="50" height="50" rx="5" fill="#236957"/><text x="168" y="320" font-size="23" fill="#d9e4f0" font-weight="normal">1</text><rect x="205" y="287" width="50" height="50" rx="5" fill="#236957"/><text x="223" y="320" font-size="23" fill="#d9e4f0" font-weight="normal">1</text><text x="40" y="375" font-size="19" fill="#d9e4f0" font-weight="normal">One of 32 fixed masks</text><text x="330" y="140" font-size="22" fill="#68b8ff" font-weight="normal">Subset 0 → RGB endpoints A, B</text><text x="330" y="178" font-size="22" fill="#70dec2" font-weight="normal">Subset 1 → RGB endpoints C, D</text><text x="330" y="224" font-size="19" fill="#d9e4f0" font-weight="normal">Each texel selects one of 8 palette entries with a 3-bit index.</text><text x="330" y="267" font-size="20" fill="#d9e4f0" font-weight="normal">Endpoint code → integer unquantize → integer interpolation</text><text x="330" y="301" font-size="20" fill="#d9e4f0" font-weight="normal">→ finish scaling → reinterpret the result as FP16 → RGB feature</text><text x="330" y="349" font-size="18" fill="#ffcb70" font-weight="normal">Interpolation happens in encoded number space, before FP16 conversion.</text><rect x="36" y="413" width="140" height="58" rx="12" fill="#3b536e"/><text x="48" y="450" font-size="18" fill="#d9e4f0" font-weight="normal">Mode: 5</text><rect x="182" y="413" width="160" height="58" rx="12" fill="#285980"/><text x="194" y="450" font-size="18" fill="#d9e4f0" font-weight="normal">Partition: 5</text><rect x="348" y="413" width="440" height="58" rx="12" fill="#236957"/><text x="360" y="450" font-size="18" fill="#d9e4f0" font-weight="normal">Endpoints: 4 × 3 × 6 = 72</text><rect x="794" y="413" width="372" height="58" rx="12" fill="#68552e"/><text x="806" y="450" font-size="18" fill="#d9e4f0" font-weight="normal">Indices: 16 × 3 − 2 = 46</text><text x="36" y="513" font-size="18" fill="#d9e4f0" font-weight="normal">Two anchor texels omit one index bit each. Swapping that subset’s endpoints and reversing its indices</text><text x="36" y="542" font-size="18" fill="#d9e4f0" font-weight="normal">preserves the colors while making the omitted high bit zero. The packer does this automatically.</text><text x="36" y="589" font-size="19" fill="#70dec2" font-weight="normal">Verified: all 32 masks, anchor flips, boundary codes, independent decoder, and RX 9070 hardware.</text></g></svg>