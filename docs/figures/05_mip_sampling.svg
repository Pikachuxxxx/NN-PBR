<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="582" viewBox="0 0 1200 582"><rect width="1200" height="582" fill="#0b1524"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="48" font-size="28" fill="#d9e4f0" font-weight="bold">MIP LEVELS: APPLY THE SIZE CHANGE ONCE</text><text x="36" y="85" font-size="19" fill="#d9e4f0" font-weight="normal">Example: a 2048-wide reference, a 512-wide feature texture, and reference LOD 4.</text><rect x="36" y="126" width="350" height="228" rx="12" fill="#16283d"/><text x="51" y="165" font-size="19" fill="#70dec2" font-weight="bold">CORRECT EXPLICIT LOD</text><text x="51" y="212" font-size="17" fill="#d9e4f0" font-weight="normal">bias = log₂(512 / 2048) = −2</text><text x="51" y="250" font-size="17" fill="#d9e4f0" font-weight="normal">feature LOD = 4 + (−2) = 2</text><rect x="426" y="126" width="350" height="228" rx="12" fill="#16283d"/><text x="441" y="165" font-size="19" fill="#68b8ff" font-weight="bold">CORRECT textureGrad</text><text x="441" y="212" font-size="17" fill="#d9e4f0" font-weight="normal">Pass the original UV gradients.</text><text x="441" y="250" font-size="17" fill="#d9e4f0" font-weight="normal">Sampler uses its own 512 width.</text><text x="441" y="288" font-size="17" fill="#d9e4f0" font-weight="normal">It naturally selects feature LOD 2.</text><rect x="816" y="126" width="350" height="228" rx="12" fill="#16283d"/><text x="831" y="165" font-size="19" fill="#ffcb70" font-weight="bold">OLD DOUBLE BIAS</text><text x="831" y="212" font-size="17" fill="#d9e4f0" font-weight="normal">Sampler accounts for texture size.</text><text x="831" y="250" font-size="17" fill="#d9e4f0" font-weight="normal">Gradients also multiplied by ¼.</text><text x="831" y="288" font-size="17" fill="#d9e4f0" font-weight="normal">Feature LOD becomes 0: too sharp.</text><text x="36" y="406" font-size="23" fill="#70dec2" font-weight="normal">Train and CPU export reader: explicit reference LOD + one bias.</text><text x="36" y="447" font-size="23" fill="#70dec2" font-weight="normal">Vulkan: raw UV gradients, no extra bias multiplier.</text><text x="36" y="500" font-size="19" fill="#d9e4f0" font-weight="normal">Compute gradients BEFORE fract() or panel branches. Wrapping introduces discontinuities.</text><text x="36" y="542" font-size="19" fill="#d9e4f0" font-weight="normal">Use clamp-to-edge consistently. Periodic wrapping can be added only if training uses it too.</text></g></svg>